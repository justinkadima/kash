name: release

# Builds binaries for every v* tag, packages them, and attaches them to a
# GitHub Release. From now on the release flow is just:
#   git tag -a v0.2 -m "notes" && git push origin v0.2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # checkout fetches the tag ref shallow, dereferencing annotated tags
      # to plain commits; fetch the real tag objects so the release notes
      # can use the tag annotation.
      - name: Fetch full tag
        run: git fetch --tags --force origin

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build() {
            local os="$1" arch="$2"
            local name="kash_${ver}_${os}_${arch}"
            local bin="kash"
            [ "$os" = "windows" ] && bin="kash.exe"
            mkdir "$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "$name/$bin" .
            cp LICENSE README.md "$name/"
            if [ "$os" = "windows" ]; then
              (cd "$name" && zip -r "../dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "$name"
          }

          build linux   amd64
          build linux   arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64
          build windows arm64

          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Publish GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release already exists (e.g. a retry): refresh assets and
            # notes instead of failing.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --notes "$notes"
          fi